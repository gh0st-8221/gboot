timeout 3
default 1
title gboot

entry Arch Linux
kernel /vmlinuz-linux
initrd /intel-ucode.img
initrd /initramfs-linux.img
options root=UUID=REPLACE-ME rw quiet

entry Arch Linux (ginit)
kernel /vmlinuz-linux
initrd /intel-ucode.img
initrd /initramfs-linux.img
options root=UUID=REPLACE-ME rw quiet init=/usr/local/bin/ginit

entry Windows
efi /EFI/Microsoft/Boot/bootmgfw.efi

entry Firmware setup
firmware

entry Reboot
reboot

entry Shutdown
shutdown
